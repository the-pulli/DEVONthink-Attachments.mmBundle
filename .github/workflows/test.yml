name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Ruby version
        run: ruby --version

      - name: Run tests
        run: |
          for f in test/*_test.rb; do
            echo "== $f =="
            ruby "$f"
          done
